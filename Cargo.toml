[package]
name = "telemetry-agent"
version = "1.2.0"
edition = "2021"
authors = ["PT Gerlink Utama Mandiri <rnd@gerlink.id>"]
description = "Gerlink TelemetryAgent background client for medical reporting stations"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["full"] }

[[bin]]
name = "telemetry-agent"
path = "src/main.rs"

[lib]
name = "telemetry_agent"
path = "src/lib.rs"
